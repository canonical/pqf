# config/dimensions.yaml
# The single configuration knob for the entire scoring system.
# Adding a dimension = add an entry here + create scorers/<name>/scorer.py

dimensions:

  test_verification:
    label: "Test verification"
    description: "Automated test coverage, stability, and CI build status for component code."
    scorer: "scorers/test_verification/scorer.py"
    applies_to:
      product_types: ["charm", "snap"]
    aggregation: "worst_in_scope"
    required_metrics_for_scoring:
      - latest_build_passing
    outputs:
      coverage_pct: {type: number, range: "0–100", label: "Coverage", description: "Percentage of automated test checks passing in the latest Allure summary."}
      stability_pct: {type: number, range: "0–100", label: "Stability", description: "Percentage of non-broken, non-failed checks in the latest Allure summary."}
      latest_build_passing: {type: boolean, label: "Latest build passing", description: "Whether the latest published test summary has zero failed and broken checks."}
      integration_test_evidence_present: {type: boolean, label: "Integration test evidence", description: "Repository contains deterministic evidence that integration tests exist and run in CI."}
      uses_ops_testing: {type: boolean, label: "Uses ops.testing (no Harness)", description: "No deprecated Harness usage detected via code search."}
      uses_jubilant: {type: boolean, label: "Uses Jubilant", description: "Integration tests import Jubilant."}
    medals:
      silver: ["coverage_pct >= 80", "stability_pct >= 85", "integration_test_evidence_present == true"]
      gold: ["coverage_pct >= 90", "stability_pct >= 98", "integration_test_evidence_present == true"]

  documentation:
    label: "Documentation"
    description: "Repository documentation baseline presence and maturity signals (README, contributing, release notes process, and docs CI)."
    scorer: "scorers/documentation/scorer.py"
    applies_to:
      product_types: ["charm", "snap"]
    aggregation: "worst_in_scope"
    required_metrics_for_scoring:
      - readme_present
      - contributing_present
      - has_security
    outputs:
      readme_present: {type: boolean, label: "README present", description: "README.md exists and is non-empty."}
      contributing_present: {type: boolean, label: "CONTRIBUTING present", description: "CONTRIBUTING.md exists and is non-empty."}
      has_security: {type: boolean, label: "SECURITY present", description: "SECURITY.md exists in the primary repository."}
      documentation_workflows_passing: {type: boolean, label: "Documentation workflows passing", description: "Documentation-specific CI workflows (lint, link-check, build) are present and passing on default branch."}
      release_notes_process_implemented: {type: boolean, label: "Release notes process implemented", description: "Repository has canonical release-notes workflow + structure evidence (common.yaml, releases/, template/, and canonical release-notes automation)."}
      diataxis_coverage_ai: {type: number, range: "0–4", label: "Diátaxis coverage (AI)", description: "AI-assisted Diátaxis assessment (informational).", informational: true, ai_assisted: true}
      uses_rtd_hosting: {type: boolean, label: "Uses RTD hosting", description: "Documentation points at a Read the Docs host.", informational: true}
    medals:
      bronze: ["readme_present == true", "contributing_present == true", "has_security == true"]
      silver: ["readme_present == true", "contributing_present == true", "has_security == true", "release_notes_process_implemented == true"]
      gold: ["readme_present == true", "contributing_present == true", "has_security == true", "release_notes_process_implemented == true", "documentation_workflows_passing == true"]

  substrate_compat:
    label: "Substrate compatibility"
    description: "Compatibility with Juju and Canonical Kubernetes targets; tests and metadata indicating substrate support."
    scorer: "scorers/substrate_compat/scorer.py"
    applies_to:
      product_types: ["charm"]
    aggregation: "worst_in_scope"
    required_metrics_for_scoring:
      - supports_juju_3
      - substrate_test_evidence_present
    outputs:
      supports_juju_3: {type: boolean, label: "Juju 3 support", description: "Workflow or metadata evidence declares Juju 3 support."}
      supports_juju_4: {type: boolean, label: "Juju 4 support", description: "Workflow or metadata evidence declares Juju 4 support."}
      substrate_test_evidence_present: {type: boolean, label: "Substrate test evidence", description: "Workflow evidence shows declared Juju/substrate targets are exercised in CI."}
      uses_canonical_k8s: {type: boolean, label: "Uses Canonical K8s", description: "Workflow evidence references Canonical K8s."}
    medals:
      silver: ["supports_juju_3 == true", "substrate_test_evidence_present == true"]
      gold: ["supports_juju_4 == true", "substrate_test_evidence_present == true"]

  security_ssdlc:
    label: "Security (SSDLC)"
    description: "Security toolchain and processes: repository automation, branch protection, dependency updates, and SAST workflow presence."
    scorer: "scorers/security_ssdlc/scorer.py"
    applies_to:
      product_types: ["charm", "snap"]
    aggregation: "worst_in_scope"
    required_metrics_for_scoring:
      - branch_protection_required_checks
      - renovate_enabled
    outputs:
      renovate_enabled: {type: boolean, label: "Renovate enabled", description: "Repository is configured for Renovate updates."}
      canonical_repo_automation_registered: {type: boolean, label: "Canonical repo automation registered", description: "Repository is onboarded in canonical-repo-automation."}
      branch_protection_required_checks: {type: boolean, label: "Branch protection with required checks", description: "Default branch has required checks configured."}
      signed_commits_required: {type: boolean, label: "Signed commits required", description: "Default branch requires commit signatures (GPG or SSH)."}
      sast_workflow_present: {type: boolean, label: "SAST workflow present", description: "Repository exposes an existing static security analysis workflow."}
      cve_tracking_process_present: {type: boolean, label: "CVE tracking process present", description: "Repository exposes a CVE or security maintenance process marker."}
    medals:
      silver: ["branch_protection_required_checks == true", "renovate_enabled == true", "signed_commits_required == true"]
      gold: ["branch_protection_required_checks == true", "renovate_enabled == true", "signed_commits_required == true", "sast_workflow_present == true", "cve_tracking_process_present == true"]

  engagement:
    label: "Engagement"
    description: "Community and user engagement metrics: maintainer responsiveness (triage, PR review, ownership signals) and repository traffic."
    scorer: "scorers/engagement/scorer.py"
    applies_to:
      product_types: ["root", "charm", "snap"]
    aggregation: "worst_in_scope"
    required_metrics_for_scoring:
      - avg_triage_days
      - avg_pr_review_days
      - response_coverage_rate
    outputs:
      avg_triage_days: {type: number, range: "≥ 0 days", label: "Avg. triage time", description: "Average days from issue creation to first non-author response."}
      avg_pr_review_days: {type: number, range: "≥ 0 days", label: "Avg. PR review time", description: "Average days from PR opening to first submitted review."}
      response_coverage_rate: {type: number, range: "0–100", label: "Response coverage", description: "Percentage of recent issues and PRs that received a first response within the measurement window."}
      ownership_signal: {type: boolean, label: "Ownership signal", description: "Repository exposes clear ownership through a squad topic."}
      has_jira_sync: {type: boolean, label: "Jira sync configured", description: "Repository has GitHub-to-Jira sync configuration."}
      repo_views_14d: {type: number, range: "≥ 0", label: "Repository views (14d)", description: "Total page views of the GitHub repository in the last 14 days (informational).", informational: true}
    medals:
      bronze: ["ownership_signal == true"]
      silver: ["avg_triage_days <= 3", "avg_pr_review_days <= 5", "response_coverage_rate >= 80", "ownership_signal == true"]
      gold: ["avg_triage_days <= 2", "avg_pr_review_days <= 3", "response_coverage_rate >= 90", "ownership_signal == true"]
