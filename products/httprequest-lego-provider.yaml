id: httprequest-lego-provider
product_type: root
name: HTTP Request Lego Provider
description: 'HTTP Request Lego Provider is a Juju charm deploying and managing

  `HTTP request Lego provider as defined by ACME <https://go-acme.github.io/lego/dns/httpreq/>`_

  on Kubernetes. It is a web application that implements the DNS HTTP request provider

  to manage DNS records, enabling the automation of DNS management for ACME certificate
  issuance.


  This charm simplifies initial deployment and operations on Kubernetes, allowing

  deployment on many different Kubernetes platforms, from MicroK8s to Charmed Kubernetes

  and public cloud Kubernetes offerings.'
lifecycle: stable
introduced_in: v0
targets:
  v0: gold
  v1: gold
ownership:
  squad: emea
  stakeholders:
  - IS
documentation_url: https://charmhub.io/httprequest-lego-provider
composed_of:
