id: jenkins
product_type: root
name: Jenkins
description: 'Jenkins is an extendable continuous integration server that monitors
  executions of repeated jobs.

  The focus of Jenkins is the building/testing of software projects continuously,
  and monitoring

  executions of externally-run jobs. This product provides the Jenkins server service
  with both

  Kubernetes and machine agent support for flexible automation environments.'
lifecycle: stable
introduced_in: v0
targets:
  v0: bronze
  v1: bronze
ownership:
  squad: apac
  stakeholders:
  - IS
documentation_url: https://charmhub.io/jenkins-k8s/docs
composed_of:
- id: jenkins-k8s
  product_type: charm
  introduced_in: v0
  source:
    repo: canonical/jenkins-k8s-operator
  allure_report_url: https://canonical.github.io/jenkins-k8s-operator/_latest
- id: jenkins-agent-k8s
  product_type: charm
  introduced_in: v0
  source:
    repo: canonical/jenkins-agent-k8s-operator
- id: jenkins-agent
  product_type: charm
  introduced_in: v0
  source:
    repo: canonical/jenkins-agent-operator
