id: haproxy
product_type: root
name: HAProxy
description: 'HAProxy is a TCP/HTTP reverse proxy which is particularly suited for
  high availability environments.

  It features connection persistence through HTTP cookies, load balancing, header
  addition, modification, deletion both ways.

  It has request blocking capabilities and provides interface to display server status.'
lifecycle: stable
introduced_in: v0
targets:
  v0: gold
  v1: gold
ownership:
  squad: emea
  stakeholders:
  - IS
