id: backup
product_type: root
name: Backup
description: 'The Backup product provides an easy-to-use, highly integrated backup
  solution

  for charms in Juju, built on top of the Bacula backup system.


  It includes a server charm managing all Bacula server components (Director,

  Storage Daemon, and Baculum web UI), a subordinate File Daemon charm deployed

  alongside workloads to be backed up, and an integrator charm that brokers

  backup relations on behalf of other charms.'
lifecycle: stable
introduced_in: v0
targets:
  v0: silver
  v1: silver
ownership:
  squad: apac
  stakeholders:
  - IS
documentation_url: https://documentation.ubuntu.com/backup-operators/
composed_of:
- id: bacula-server
  product_type: charm
  introduced_in: v0
  source:
    repo: canonical/backup-operators
    subpath: bacula_server_operator
- id: bacula-fd
  product_type: charm
  introduced_in: v0
  source:
    repo: canonical/backup-operators
    subpath: bacula_fd_operator
- id: backup-integrator
  product_type: charm
  introduced_in: v0
  source:
    repo: canonical/backup-operators
    subpath: backup_integrator_operator
- id: charmed-bacula-server
  product_type: snap
  introduced_in: v0
  source:
    repo: canonical/backup-operators
    subpath: charmed_bacula_server
