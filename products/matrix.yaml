id: matrix
product_type: root
name: Matrix
description: |-
  Matrix is a drop in replacement for other chat servers like Mattermost and Slack.
  The synapse charm is useful if you want to spin up your own chat instance.
lifecycle: stable
target_medal: bronze
ownership:
  squad: americas
  stakeholders:
    - Mauro Gaspari
    - Aaron Prisk
    - IS
composed_of:
  - id: synapse
    product_type: charm
    source:
      repo: canonical/synapse-operator
    target_medal: bronze
  - id: draupnir
    product_type: snap
    source:
      repo: canonical/draupnir-snap
    target_medal: bronze
  - id: mjolnir
    product_type: snap
    source:
      repo: canonical/mjolnir-snap
    target_medal: bronze
  - id: mas-cli
    product_type: snap
    source:
      repo: canonical/mas-cli-snap
    target_medal: bronze
  - id: matrix-appservice-irc
    product_type: snap
    source:
      repo: canonical/matrix-appservice-irc
    target_medal: bronze
  - id: synapse-stats-exporter
    product_type: snap
    source:
      repo: canonical/synapse_stats_exporter
    target_medal: bronze
documentation_url: https://ubuntu.com/community/communications/matrix
context_refs:
