id: matrix
product_type: root
name: Matrix
description: 'Matrix is a drop in replacement for other chat servers like Mattermost
  and Slack.

  The synapse charm is useful if you want to spin up your own chat instance.'
lifecycle: stable
introduced_in: v0
targets:
  v0: gold
  v1: gold
ownership:
