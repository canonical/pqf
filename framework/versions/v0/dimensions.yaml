dimensions:
  test_verification:
    label: "Testing"
    description: "Standard testing tools and configuration for the 27.04 cycle."
    scorer: "scorers/test_verification/scorer.py"
    applies_to:
      product_types: ["charm", "snap"]
    aggregation: "worst_in_scope"
    parameters:
      juju4_track: "4/stable"
      juju_lts_track: "3.6/stable"
    required_metrics_for_scoring:
      - uses_ops_testing
      - uses_gh_runners_unit_testing
      - uses_jubilant
      - uses_tf_v1_provider
      - uses_charm_ci
      - supports_canonical_k8s
      - supports_juju_4
      - supports_juju_lts
    outputs:
      uses_ops_testing:
        implementation: "uses-ops-testing/v1"
        type: boolean
        label: "Uses Ops Testing"
        description: "Unit tests use ops.testing without legacy Harness."
      uses_gh_runners_unit_testing:
        implementation: "uses-gh-runners-unit-testing/v1"
        type: boolean
        label: "GitHub-hosted unit testing"
        description: "Unit-test jobs run on GitHub-hosted runners."
      uses_jubilant:
        implementation: "uses-jubilant/v2"
        type: boolean
        label: "Uses Jubilant"
        description: "Component integration tests use Jubilant."
      uses_tf_v1_provider:
        implementation: "uses-tf-v1-provider/v1"
        type: boolean
        label: "Terraform Juju provider v1"
        description: "Component Terraform modules constrain the Juju provider to major version 1."
      uses_charm_ci:
        implementation: "uses-charm-ci/v1"
        type: boolean
        label: "Uses charm-ci"
        description: "Integration jobs use Canonical charm-ci instead of operator-workflows."
      supports_canonical_k8s:
        implementation: "supports-canonical-k8s/v1"
        type: boolean
        label: "Canonical Kubernetes configured"
        description: "Kubernetes charm-ci tests configure Canonical Kubernetes through linked Concierge configuration."
      supports_juju_4:
        implementation: "supports-juju-4/v2"
        type: boolean
        label: "Juju 4 configured"
        description: "Linked charm-ci configuration targets the cycle-pinned Juju 4 stable track."
      supports_juju_lts:
        implementation: "supports-juju-lts/v1"
        type: boolean
        label: "Juju LTS configured"
        description: "Linked charm-ci configuration targets the cycle-pinned Juju LTS stable track."
    medals:
      bronze:
        - "uses_ops_testing == true"
        - "uses_gh_runners_unit_testing == true"
      silver:
        - "uses_ops_testing == true"
        - "uses_gh_runners_unit_testing == true"
        - "uses_jubilant == true"
        - "uses_tf_v1_provider == true"
      gold:
        - "uses_ops_testing == true"
        - "uses_gh_runners_unit_testing == true"
        - "uses_jubilant == true"
        - "uses_tf_v1_provider == true"
        - "uses_charm_ci == true"
        - "supports_canonical_k8s == true"
        - "supports_juju_4 == true"
        - "supports_juju_lts == true"

  documentation:
    label: "Documentation"
    description: "Customized repository documentation and Canonical Sphinx Stack adoption."
    scorer: "scorers/documentation/scorer.py"
    applies_to:
      product_types: ["charm", "snap"]
    aggregation: "worst_in_scope"
    required_metrics_for_scoring:
      - readme_present
      - contributing_present
      - has_security
      - uses_sphinx_stack
    outputs:
      readme_present:
        implementation: "readme-present/v2"
        type: boolean
        label: "README customized"
        description: "Repository-root README.md has content beyond headings and differs from the pinned template."
      contributing_present:
        implementation: "contributing-present/v2"
        type: boolean
        label: "CONTRIBUTING customized"
        description: "Repository-root CONTRIBUTING.md has content beyond headings and differs from the pinned template."
      has_security:
        implementation: "security-file-present/v2"
        type: boolean
        label: "SECURITY customized"
        description: "Repository-root SECURITY.md has content beyond headings and differs from the pinned template."
      uses_sphinx_stack:
        implementation: "uses-sphinx-stack/v1"
        type: string
        label: "Sphinx Stack version"
        description: "Declared Canonical Sphinx Stack version; an empty string means no adoption. Snaps and reviewed upstream-docs exemptions are not applicable."
      diataxis_coverage_ai:
        implementation: "diataxis-coverage-ai/v2"
        type: number
        range: "0-4"
        label: "Diataxis coverage (AI)"
        description: "AI-assisted coverage assessment of authoritative documentation; informational only."
        informational: true
        ai_assisted: true
    medals:
      bronze: ["readme_present == true"]
      silver: ["readme_present == true", "contributing_present == true", "has_security == true"]
      gold:
        - "readme_present == true"
        - "contributing_present == true"
        - "has_security == true"
        - 'uses_sphinx_stack != ""'

  security_ssdlc:
    label: "Security"
    description: "Dependency updates and effective default-branch protections."
    scorer: "scorers/security_ssdlc/scorer.py"
    applies_to:
      product_types: ["charm", "snap"]
    aggregation: "worst_in_scope"
    required_metrics_for_scoring:
      - renovate_enabled
      - branch_protection_required_checks
      - signed_commits_required
    outputs:
      renovate_enabled:
        implementation: "renovate-enabled/v2"
        type: boolean
        label: "Renovate onboarded"
        description: "Enabled onboarding configuration and an open Dependency Dashboard authored by the verified Renovate bot; not a runtime heartbeat."
      branch_protection_required_checks:
        implementation: "branch-protection-required-checks/v2"
        type: boolean
        label: "Required checks enforced"
        description: "Effective classic protection or active rulesets enforce status checks on the default branch."
      signed_commits_required:
        implementation: "signed-commits-required/v2"
        type: boolean
        label: "Signed commits required"
        description: "Effective classic protection or active rulesets require signed commits on the default branch."
    # The team chose one security baseline, without artificial intermediate tiers.
    medals:
      bronze: ["renovate_enabled == true", "branch_protection_required_checks == true", "signed_commits_required == true"]
      silver: ["renovate_enabled == true", "branch_protection_required_checks == true", "signed_commits_required == true"]
      gold: ["renovate_enabled == true", "branch_protection_required_checks == true", "signed_commits_required == true"]
