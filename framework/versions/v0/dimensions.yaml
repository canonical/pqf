dimensions:
  test_verification:
    label: "Testing"
    description: "Standard testing tools and configuration for the 27.04 cycle."
    scorer: "scorers/test_verification/scorer.py"
    applies_to:
      product_types: ["charm", "snap"]
    aggregation: "worst_in_scope"
    parameters:
      juju4_track: "4/stable"
      juju_lts_track: "3.6/stable"
    required_metrics_for_scoring:
      - uses_ops_testing
      - uses_gh_runners_unit_testing
      - uses_jubilant
      - uses_tf_v1_provider
      - uses_charm_ci
      - supports_canonical_k8s
      - supports_juju_4
      - supports_juju_lts
    outputs:
      uses_ops_testing:
        implementation: "uses-ops-testing/v1"
        type: boolean
        label: "Uses Ops Testing"
        description: "Checks Python files in tests/unit directories under the charm for an ops.testing import and no legacy Harness references or ops.testing wildcard imports. Unparseable tests can give insufficient data."
      uses_gh_runners_unit_testing:
        implementation: "uses-gh-runners-unit-testing/v1"
        type: boolean
        label: "GitHub-hosted unit testing"
        description: "Checks recognized unit-test jobs, including tox -e unit and pytest tests/unit: all must use GitHub-hosted runners. No recognized job or a self-hosted runner fails; unresolved runners give insufficient data."
      uses_jubilant:
        implementation: "uses-jubilant/v2"
        type: boolean
        label: "Uses Jubilant"
        description: "Checks Python files in tests/integration directories under the charm for a Jubilant import. Imports elsewhere do not count; unparseable tests can give insufficient data."
      uses_tf_v1_provider:
        implementation: "uses-tf-v1-provider/v4"
        type: boolean
        label: "Juju provider v1+"
        description: "Checks every Terraform module in the repository, including examples, tests, and sibling charms. Juju or unclassified modules must explicitly require juju/juju version 1.0 or newer; proven non-Juju modules are excluded. Missing requirements or older allowed versions fail; unreadable constraints give insufficient data. No applicable modules is not applicable."
      uses_charm_ci:
        implementation: "uses-charm-ci/v1"
        type: boolean
        label: "Uses charm-ci"
        description: "Checks GitHub workflows for a canonical/charm-ci integration-test workflow that applies to the charm. This checks configuration, not whether the tests ran or passed."
      supports_canonical_k8s:
        implementation: "supports-canonical-k8s/v1"
        type: boolean
        label: "Canonical Kubernetes configured"
        description: "For Kubernetes charms, checks whether a charm-ci integration suite's linked Concierge configuration enables and bootstraps the k8s provider. Missing configuration does not count; dynamic or uninterpretable configuration can give insufficient data. Machine charms are not applicable."
      supports_juju_4:
        implementation: "supports-juju-4/v2"
        type: boolean
        label: "Juju 4 configured"
        description: "Checks whether a charm-ci integration suite's linked Concierge configuration specifies a Juju 4 stable channel. This checks configuration, not whether tests ran or passed."
      supports_juju_lts:
        implementation: "supports-juju-lts/v1"
        type: boolean
        label: "Juju LTS configured"
        description: "Checks whether a charm-ci integration suite's linked Concierge configuration specifies the cycle's Juju LTS channel (3.6/stable). This checks configuration, not whether tests ran or passed."
    medals:
      bronze:
        - "uses_ops_testing == true"
        - "uses_gh_runners_unit_testing == true"
      silver:
        - "uses_ops_testing == true"
        - "uses_gh_runners_unit_testing == true"
        - "uses_jubilant == true"
        - "uses_tf_v1_provider == true"
      gold:
        - "uses_ops_testing == true"
        - "uses_gh_runners_unit_testing == true"
        - "uses_jubilant == true"
        - "uses_tf_v1_provider == true"
        - "uses_charm_ci == true"
        - "supports_canonical_k8s == true"
        - "supports_juju_4 == true"
        - "supports_juju_lts == true"

  documentation:
    label: "Documentation"
    description: "Customized repository documentation and Canonical Sphinx Stack adoption."
    scorer: "scorers/documentation/scorer.py"
    applies_to:
      product_types: ["charm", "snap"]
    aggregation: "worst_in_scope"
    required_metrics_for_scoring:
      - readme_present
      - contributing_present
      - has_security
      - uses_sphinx_stack
    outputs:
      readme_present:
        implementation: "readme-present/v2"
        type: boolean
        label: "README customized"
        description: "Checks root README.md for content beyond headings and comments, and rejects an unchanged copy of the pinned charm template."
      contributing_present:
        implementation: "contributing-present/v2"
        type: boolean
        label: "CONTRIBUTING customized"
        description: "Checks root CONTRIBUTING.md for content beyond headings and comments, and rejects an unchanged copy of the pinned charm template."
      has_security:
        implementation: "security-file-present/v2"
        type: boolean
        label: "SECURITY customized"
        description: "Checks root SECURITY.md for content beyond headings and comments. The standard PFE security policy template counts."
      uses_sphinx_stack:
        implementation: "uses-sphinx-stack/v1"
        type: string
        label: "Sphinx Stack version"
        description: "Reads a valid version from <documentation path>/_dev/version in the product repository. A missing or invalid version is blank; snaps and products with a documentation exemption or no user-facing docs are not applicable."
      diataxis_coverage_ai:
        implementation: "diataxis-coverage-ai/v2"
        type: number
        range: "0-4"
        label: "Diataxis coverage (AI)"
        description: "AI counts Diataxis modes (tutorial, how-to, reference, explanation) with meaningful content in Markdown and reStructuredText under the configured docs path, excluding hidden and underscore-prefixed directories. Too little documentation, traversal limits, or unavailable AI give insufficient data. Informational only."
        informational: true
        ai_assisted: true
    medals:
      bronze: ["readme_present == true"]
      silver: ["readme_present == true", "contributing_present == true", "has_security == true"]
      gold:
        - "readme_present == true"
        - "contributing_present == true"
        - "has_security == true"
        - 'uses_sphinx_stack != ""'

  security_ssdlc:
    label: "Security"
    description: "Dependency updates and effective default-branch protections."
    scorer: "scorers/security_ssdlc/scorer.py"
    applies_to:
      product_types: ["charm", "snap"]
    aggregation: "worst_in_scope"
    required_metrics_for_scoring:
      - renovate_enabled
      - branch_protection_required_checks
      - signed_commits_required
    outputs:
      renovate_enabled:
        implementation: "renovate-enabled/v2"
        type: boolean
        label: "Renovate onboarded"
        description: "Checks for an enabled Renovate configuration and an open Dependency Dashboard issue created by renovate[bot]. Missing or disabled configuration or dashboard fails; unsupported configuration gives insufficient data."
      branch_protection_required_checks:
        implementation: "branch-protection-required-checks/v2"
        type: boolean
        label: "Required checks enforced"
        description: "Checks the default branch for at least one required status check in classic protection or an active applicable ruleset without bypass actors. Evaluate-mode rulesets and protection without checks do not count."
      signed_commits_required:
        implementation: "signed-commits-required/v2"
        type: boolean
        label: "Signed commits required"
        description: "Checks whether classic protection or an active applicable ruleset without bypass actors requires signed commits on the default branch. Evaluate-mode rulesets do not count."
    # The team chose one security baseline, without artificial intermediate tiers.
    medals:
      bronze: ["renovate_enabled == true", "branch_protection_required_checks == true", "signed_commits_required == true"]
      silver: ["renovate_enabled == true", "branch_protection_required_checks == true", "signed_commits_required == true"]
      gold: ["renovate_enabled == true", "branch_protection_required_checks == true", "signed_commits_required == true"]
