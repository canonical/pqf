dimensions:
  test_verification:
    label: "Test verification"
    description: "Automated test coverage, stability, and CI evidence for component code."
    scorer: "scorers/test_verification/scorer.py"
    applies_to:
      product_types: ["charm", "snap"]
    aggregation: "worst_in_scope"
    required_metrics_for_scoring:
      - latest_build_passing
      - integration_test_evidence_present
      - uses_jubilant
    outputs:
      latest_build_passing:
        implementation: "latest-build-passing/v1"
        type: boolean
        label: "Latest build passing"
        description: "Whether the latest published test summary has zero failed and broken checks."
      integration_test_evidence_present:
        implementation: "integration-test-evidence-present/v1"
        type: boolean
        label: "Integration test evidence"
        description: "Repository contains deterministic evidence that integration tests exist and run in CI."
      uses_jubilant:
        implementation: "uses-jubilant/v1"
        type: boolean
        label: "Uses Jubilant"
        description: "Integration tests import Jubilant."
      coverage_pct:
        implementation: "coverage-pct/v1"
        type: number
        range: "0–100"
        label: "Coverage"
        description: "Percentage of automated test checks passing in the latest Allure summary."
        informational: true
      stability_pct:
        implementation: "stability-pct/v1"
        type: number
        range: "0–100"
        label: "Stability"
        description: "Percentage of non-broken, non-failed checks in the latest Allure summary."
        informational: true
    medals:
      bronze: ["latest_build_passing == true"]
      silver: ["latest_build_passing == true", "integration_test_evidence_present == true"]
      gold:
        [
          "latest_build_passing == true",
          "integration_test_evidence_present == true",
          "uses_jubilant == true",
        ]

  documentation:
    label: "Documentation"
    description: "Repository documentation baseline presence and operational process signals."
    scorer: "scorers/documentation/scorer.py"
    applies_to:
      product_types: ["charm", "snap"]
    aggregation: "worst_in_scope"
    required_metrics_for_scoring:
      - readme_present
      - contributing_present
      - has_security
      - release_notes_process_implemented
    outputs:
      readme_present:
        implementation: "readme-present/v1"
        type: boolean
        label: "README present"
        description: "README.md exists and is non-empty."
      contributing_present:
        implementation: "contributing-present/v1"
        type: boolean
        label: "CONTRIBUTING present"
        description: "CONTRIBUTING.md exists and is non-empty."
      has_security:
        implementation: "security-file-present/v1"
        type: boolean
        label: "SECURITY present"
        description: "SECURITY.md exists in the primary repository."
      release_notes_process_implemented:
        implementation: "release-notes-process-implemented/v1"
        type: boolean
        label: "Release notes process implemented"
        description: "Repository has canonical release-notes workflow + structure evidence (common.yaml, releases/, template/, and canonical release-notes automation)."
      documentation_workflows_passing:
        implementation: "documentation-workflow-status/v1"
        type: boolean
        label: "Documentation workflow status"
        description: "Documentation-specific CI workflows (lint, link-check, build) are present and passing on default branch."
        informational: true
      diataxis_coverage_ai:
        implementation: "diataxis-coverage-ai/v1"
        type: number
        range: "0–4"
        label: "Diátaxis coverage (AI)"
        description: "AI-assisted Diátaxis assessment (informational)."
        informational: true
        ai_assisted: true
      uses_rtd_hosting:
        implementation: "uses-rtd-hosting/v1"
        type: boolean
        label: "Uses RTD hosting"
        description: "Documentation points at a Read the Docs host."
        informational: true
      has_changelog:
        implementation: "changelog-present/v1"
        type: boolean
        label: "CHANGELOG present"
        description: "CHANGELOG.md exists in the repository root."
        informational: true
    medals:
      bronze: ["readme_present == true"]
      silver: ["readme_present == true", "contributing_present == true"]
      gold:
        [
          "readme_present == true",
          "contributing_present == true",
          "has_security == true",
          "release_notes_process_implemented == true",
        ]

  substrate_compat:
    label: "Substrate compatibility"
    description: "Compatibility with Juju targets and substrate test evidence."
    scorer: "scorers/substrate_compat/scorer.py"
    applies_to:
      product_types: ["charm"]
    aggregation: "worst_in_scope"
    required_metrics_for_scoring:
      - supports_juju_3
      - substrate_test_evidence_present
      - supports_juju_4
    outputs:
      supports_juju_3:
        implementation: "supports-juju-3/v1"
        type: boolean
        label: "Juju 3 support"
        description: "Workflow or metadata evidence declares Juju 3 support."
      substrate_test_evidence_present:
        implementation: "substrate-test-evidence-present/v1"
        type: boolean
        label: "Substrate test evidence"
        description: "Workflow evidence shows declared Juju/substrate targets are exercised in CI."
      supports_juju_4:
        implementation: "supports-juju-4/v1"
        type: boolean
        label: "Juju 4 support"
        description: "Workflow or metadata evidence declares Juju 4 support."
      uses_canonical_k8s:
        implementation: "uses-canonical-k8s/v1"
        type: boolean
        label: "Uses Canonical K8s"
        description: "Workflow evidence references Canonical K8s."
        informational: true
    medals:
      bronze: ["supports_juju_3 == true"]
      silver: ["supports_juju_3 == true", "substrate_test_evidence_present == true"]
      gold: ["supports_juju_4 == true", "substrate_test_evidence_present == true"]

  security_ssdlc:
    label: "Security (SSDLC)"
    description: "Security toolchain and process signals for repository protection and analysis."
    scorer: "scorers/security_ssdlc/scorer.py"
    applies_to:
      product_types: ["charm", "snap"]
    aggregation: "worst_in_scope"
    required_metrics_for_scoring:
      - renovate_enabled
      - branch_protection_required_checks
      - signed_commits_required
      - sast_workflow_present
    outputs:
      renovate_enabled:
        implementation: "renovate-enabled/v1"
        type: boolean
        label: "Renovate enabled"
        description: "Repository is configured for Renovate updates."
      branch_protection_required_checks:
        implementation: "branch-protection-required-checks/v1"
        type: boolean
        label: "Branch protection with required checks"
        description: "Default branch has required checks configured."
      signed_commits_required:
        implementation: "signed-commits-required/v1"
        type: boolean
        label: "Signed commits required"
        description: "Default branch requires commit signatures (GPG or SSH)."
      sast_workflow_present:
        implementation: "sast-workflow-present/v1"
        type: boolean
        label: "SAST workflow present"
        description: "Repository exposes an existing static security analysis workflow."
      cve_tracking_process_present:
        implementation: "cve-process-evidence/v1"
        type: boolean
        label: "CVE-process evidence"
        description: "Repository exposes a CVE or security maintenance process marker."
        informational: true
    medals:
      bronze: ["renovate_enabled == true"]
      silver: ["renovate_enabled == true", "branch_protection_required_checks == true"]
      gold:
        [
          "renovate_enabled == true",
          "branch_protection_required_checks == true",
          "signed_commits_required == true",
          "sast_workflow_present == true",
        ]

  engagement:
    label: "Engagement"
    description: "Community and user engagement signals for ownership and responsiveness."
    scorer: "scorers/engagement/scorer.py"
    applies_to:
      product_types: ["root", "charm", "snap"]
    aggregation: "worst_in_scope"
    required_metrics_for_scoring:
      - ownership_signal
      - response_coverage_rate
      - avg_triage_days
      - avg_pr_review_days
    outputs:
      ownership_signal:
        implementation: "ownership-signal/v1"
        type: boolean
        label: "Ownership signal"
        description: "Repository exposes clear ownership through a squad topic."
      response_coverage_rate:
        implementation: "response-coverage-rate/v1"
        type: number
        range: "0–100"
        label: "Response coverage"
        description: "Percentage of recent issues and PRs that received a first response within the measurement window."
      avg_triage_days:
        implementation: "avg-triage-days/v1"
        type: number
        range: "≥ 0 days"
        label: "Avg. triage time"
        description: "Average days from issue creation to first non-author response."
      avg_pr_review_days:
        implementation: "avg-pr-review-days/v1"
        type: number
        range: "≥ 0 days"
        label: "Avg. PR review time"
        description: "Average days from PR opening to first submitted review."
      has_jira_sync:
        implementation: "jira-sync-configured/v1"
        type: boolean
        label: "Jira sync"
        description: "Repository has GitHub-to-Jira sync configuration."
        informational: true
      repo_views_14d:
        implementation: "repo-views-14d/v1"
        type: number
        range: "≥ 0"
        label: "Repository views"
        description: "Total page views of the GitHub repository in the last 14 days."
        informational: true
    medals:
      bronze: ["ownership_signal == true"]
      silver:
        [
          "ownership_signal == true",
          "response_coverage_rate >= 80",
          "avg_triage_days <= 3",
          "avg_pr_review_days <= 5",
        ]
      gold:
        [
          "ownership_signal == true",
          "response_coverage_rate >= 90",
          "avg_triage_days <= 2",
          "avg_pr_review_days <= 3",
        ]
