name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Compute Metrics']
    types: [completed]

permissions:
  contents: write
  statuses: write

concurrency:
  group: gh-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # Deploy after every compute-metrics completion
    # Skip if compute-metrics failed
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: make install

      # Download the freshly computed portfolio from compute-metrics
      - name: Download computed artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: engine-artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm install
        working-directory: ui

      - name: Build UI
        run: npm run build
        working-directory: ui
        # Vite copies ../public/ into dist/ automatically via publicDir config

      # For main branch: deploy to root /
      # For PRs: deploy to pr-preview/pr-{number}/ based on branch name
      - name: Determine deployment target
        id: target
        run: |
          if [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            echo "destination=." >> $GITHUB_OUTPUT
            echo "is_pr=false" >> $GITHUB_OUTPUT
          else
            echo "destination=." >> $GITHUB_OUTPUT
            echo "is_pr=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ui/dist
          destination_dir: ${{ steps.target.outputs.destination }}
          keep_files: true
