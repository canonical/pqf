name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  detect-scope:
    runs-on: ubuntu-latest
    outputs:
      data_changed: ${{ steps.scope.outputs.data_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: scope
        name: Detect data-affecting changes
        run: |
          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            # For initial commit events, diff against the empty tree object so changes
            # introduced by the root commit are detected. Compute an empty-tree object id.
            base="$(git hash-object -t tree /dev/null)"
          else
            base="$before"
          fi

          if git diff --name-only "$base" "${{ github.sha }}" -- products/ config/ scorers/ engine/ | grep -q .; then
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: detect-scope
    if: needs.detect-scope.outputs.data_changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out current Pages data
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .gh-pages-data
          fetch-depth: 1
          persist-credentials: false

      - name: Sync deployed public data
        run: |
          rm -f public/portfolio.json
          rm -rf public/badges
          cp .gh-pages-data/portfolio.json public/portfolio.json
          cp -R .gh-pages-data/badges public/badges

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm install
        working-directory: ui

      - name: Build UI
        run: npm run build
        working-directory: ui
        # Vite copies ../public/ into dist/ automatically via publicDir config

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ui/dist
          destination_dir: .
          keep_files: true
