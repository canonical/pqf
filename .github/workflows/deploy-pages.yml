name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'ui/**'

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  detect-scope:
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.scope.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect scoring changes
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BEFORE" "$AFTER")"
          if grep -Eq '^(products/|framework/|config/|scorers/|engine/|\.github/workflows/compute-metrics\.yml$)' <<< "$changed"; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: detect-scope
    if: needs.detect-scope.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out current Pages data
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .gh-pages-data
          fetch-depth: 1
          persist-credentials: false

      - name: Sync deployed public data
        run: |
          mkdir -p public/versions
          rm -f public/portfolio.json public/framework-versions.json
          rm -rf public/badges
          cp .gh-pages-data/portfolio.json public/portfolio.json
          cp -R .gh-pages-data/badges public/badges
          if [ -f .gh-pages-data/framework-versions.json ]; then
            cp .gh-pages-data/framework-versions.json public/framework-versions.json
          fi
          if [ -d .gh-pages-data/versions ]; then
            cp -R .gh-pages-data/versions/. public/versions/
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm install
        working-directory: ui

      - name: Build UI
        run: npm run build
        working-directory: ui
        # Vite copies ../public/ into dist/ automatically via publicDir config

      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy_pages_attempt_1
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ui/dist
          destination_dir: .
          # Preserve /legacy/ and any other already-published Pages content.
          keep_files: true

      - name: Wait before deploy retry
        if: steps.deploy_pages_attempt_1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        if: steps.deploy_pages_attempt_1.outcome == 'failure'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ui/dist
          destination_dir: .
          # Preserve /legacy/ and any other already-published Pages content.
          keep_files: true
