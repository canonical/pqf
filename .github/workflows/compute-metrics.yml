# .github/workflows/compute-metrics.yml
name: Compute Metrics

on:
  schedule:
    - cron: '0 2 * * *'    # nightly at 02:00 UTC — active framework version(s)
    - cron: '0 3 * * 1'    # weekly, Monday at 03:00 UTC — upcoming framework version(s)
  workflow_dispatch:         # manual trigger
    inputs:
      framework_version:
        description: 'Framework version to score (must be active or upcoming)'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'products/**'        # re-run when a product YAML changes
      - 'framework/**'       # re-run when a framework version contract changes
      - 'config/**'          # re-run when dimension config changes
      - 'scorers/**'         # re-run when scorer logic changes
      - '!scorers/**/__tests__/**'
      - 'engine/**'          # re-run when assembly logic changes
      - '!engine/__tests__/**'
      - '.github/workflows/compute-metrics.yml'  # re-run when workflow behavior changes
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'products/**'
      - 'framework/**'
      - 'config/**'
      - 'scorers/**'
      - '!scorers/**/__tests__/**'
      - 'engine/**'
      - '!engine/__tests__/**'
      - 'ui/**'
      - '.github/workflows/compute-metrics.yml'

# Cancel any in-progress run on the same branch when a new push arrives.
# This prevents N sequential LLM runs when multiple commits land quickly.
# The nightly/weekly schedule runs are never cancelled (unique group per run_id).
concurrency:
  group: compute-metrics-${{ github.ref }}-${{ github.event_name == 'schedule' && github.run_id || 'push' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: write            # needed for the deploy jobs
  issues: read               # needed for engagement scorer (reads issues across org repos)
  pull-requests: read        # needed for engagement scorer (reads PRs across org repos)

jobs:

  # ── 0. Semantic change report (PRs only) ───────────────────────────────────
  # Summarizes framework/catalog changes by category (metadata-only, additive
  # informational, scoring-semantic, catalog membership/target) so reviewers
  # can see the blast radius before the compute jobs finish.
  change-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Needed to compare against base branch

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Generate semantic change report
        run: |
          {
            echo "## PQF semantic change report"
            python3 -m engine.change_report --base-ref "origin/${{ github.base_ref }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 1. Determine framework/product/dimension matrix ────────────────────────
  determine-matrix:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      versions: ${{ steps.build.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Needed to compare against base branch / previous push

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Build framework/product/dimension matrix
        id: build
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 3 * * 1" ]; then
              cadence=weekly
            else
              cadence=nightly
            fi
            matrix=$(python3 -m engine.workflow_matrix --cadence "$cadence")

          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            matrix=$(python3 -m engine.workflow_matrix --cadence manual \
              --framework-version "${{ github.event.inputs.framework_version }}")

          else
            # push / pull_request: include every active or upcoming framework
            # version whose framework, scorer, engine, or catalog inputs changed.
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              range="origin/${{ github.base_ref }}...HEAD"
            else
              range="${{ github.event.before }}...${{ github.sha }}"
            fi

            changed_paths=$(git diff --name-only $range -- \
              products/ framework/ config/ scorers/ engine/ \
              .github/workflows/compute-metrics.yml \
              | grep -Ev '(^|/)__tests__/' || true)

            broad_change=$(echo "$changed_paths" \
              | grep -E '^(scorers/|engine/|config/|products/|\.github/workflows/compute-metrics\.yml)' \
              || true)

            live_versions=$(python3 -c "
          from pathlib import Path
          from engine.framework import FrameworkStatus, discover_frameworks
          frameworks = discover_frameworks(Path('framework/versions'))
          live = (f.id for f in frameworks if f.status in (FrameworkStatus.ACTIVE, FrameworkStatus.UPCOMING))
          print(' '.join(live))
          ")

            selected_versions=""
            for version in $live_versions; do
              version_change=$(echo "$changed_paths" | grep -E "^framework/versions/$version/" || true)
              if [ -n "$broad_change" ] || [ -n "$version_change" ]; then
                selected_versions="$selected_versions $version"
              fi
            done

            parts=()
            for version in $selected_versions; do
              parts+=("$(python3 -m engine.workflow_matrix --cadence manual --framework-version "$version")")
            done

            if [ "${#parts[@]}" -eq 0 ]; then
              matrix='{"include":[]}'
            else
              matrix=$(printf '%s\n' "${parts[@]}" | jq -s -c '{include: (map(.include) | add)}')
            fi
          fi

          versions=$(echo "$matrix" | jq -c '[.include[].framework_version] | unique')

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  # ── 2. Run the generic scorer per (framework version, product, dimension) ──
  compute-metrics:
    if: >
      (github.event_name != 'pull_request' || github.event.action != 'closed') &&
      needs.determine-matrix.outputs.versions != '[]'
    needs: determine-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.determine-matrix.outputs.matrix) }}
      fail-fast: false
      max-parallel: 10   # Limit concurrent jobs to avoid GitHub API rate limits (1000 req/hr)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run generic scorer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p /tmp/scorer-output
          python scorers/run.py \
            --framework-root framework/versions \
            --framework-version ${{ matrix.framework_version }} \
            --dimension ${{ matrix.dimension }} \
            --product-yaml products/${{ matrix.product }}.yaml \
            --products-dir products/ \
            > "/tmp/scorer-output/${{ matrix.framework_version }}__${{ matrix.product }}__${{ matrix.dimension }}.json"

      - name: Upload scorer output
        uses: actions/upload-artifact@v4
        with:
          name: scorer-output-${{ matrix.framework_version }}-${{ matrix.product }}-${{ matrix.dimension }}
          path: /tmp/scorer-output/${{ matrix.framework_version }}__${{ matrix.product }}__${{ matrix.dimension }}.json
          retention-days: 1

  # ── 3. Merge per-dimension scorer outputs into one envelope per product ────
  merge-computed:
    if: >
      (github.event_name != 'pull_request' || github.event.action != 'closed') &&
      needs.determine-matrix.outputs.versions != '[]'
    needs: [determine-matrix, compute-metrics]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Download all scorer outputs
        uses: actions/download-artifact@v4
        with:
          pattern: scorer-output-*
          path: /tmp/scorer-output
          merge-multiple: true

      - name: Route scorer outputs into per-version/per-product directories
        run: |
          python3 - <<'EOF'
          import shutil
          from pathlib import Path

          src_dir = Path("/tmp/scorer-output")
          dst_root = Path("/tmp/scorers")
          for path in src_dir.glob("*.json"):
              framework_version, product, dimension = path.stem.split("__")
              dst_dir = dst_root / framework_version / product
              dst_dir.mkdir(parents=True, exist_ok=True)
              shutil.copy(path, dst_dir / f"{dimension}.json")
          EOF

      - name: Merge scorer outputs into versioned computed envelopes
        run: |
          set -euo pipefail
          for version_dir in /tmp/scorers/*/; do
            version=$(basename "$version_dir")
            contract_digest=$(python3 -c "
          from pathlib import Path
          from engine.framework import contract_digest, discover_frameworks, get_framework
          framework = get_framework(discover_frameworks(Path('framework/versions')), '$version')
          print(contract_digest(framework))
          ")
            fingerprints=$(python3 -c "
          import json
          from pathlib import Path
          from engine.framework import discover_frameworks, get_framework
          from scorers.registry import implementation_fingerprints
          framework = get_framework(discover_frameworks(Path('framework/versions')), '$version')
          fingerprints = {}
          for dimension_config in framework.dimensions['dimensions'].values():
              fingerprints.update(implementation_fingerprints(dimension_config))
          print(json.dumps(fingerprints, sort_keys=True))
          ")

            mkdir -p "computed/versions/$version"
            for product_dir in "$version_dir"*/; do
              product=$(basename "$product_dir")
              python3 engine/merge_computed.py \
                --product-id "$product" \
                --scorers-output-dir "$product_dir" \
                --dimensions "framework/versions/$version/dimensions.yaml" \
                --framework-version "$version" \
                --contract-digest "$contract_digest" \
                --implementation-fingerprints "$fingerprints" \
                --output "computed/versions/$version/$product.json"
            done
          done

      - name: Upload merged computed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: computed-versions
          path: computed/versions
          retention-days: 1

  # ── 4. Assemble each selected framework version's portfolio ────────────────
  assemble-versions:
    if: >
      (github.event_name != 'pull_request' || github.event.action != 'closed') &&
      needs.determine-matrix.outputs.versions != '[]'
    needs: [determine-matrix, merge-computed]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        framework_version: ${{ fromJson(needs.determine-matrix.outputs.versions) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Download merged computed artifacts
        uses: actions/download-artifact@v4
        with:
          name: computed-versions
          path: computed/versions

      - name: Assemble versioned portfolio
        run: |
          python engine/assemble.py \
            --products-dir products/ \
            --computed-dir computed/ \
            --framework-root framework/versions \
            --framework-version ${{ matrix.framework_version }} \
            --source-revision "${{ github.sha }}" \
            --output public/versions/${{ matrix.framework_version }}/portfolio.json

      - name: Determine framework status
        id: status
        run: |
          status=$(python3 -c "
          from pathlib import Path
          from engine.framework import discover_frameworks, get_framework
          framework = get_framework(discover_frameworks(Path('framework/versions')), '${{ matrix.framework_version }}')
          print(framework.status.value)
          ")
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Generate active badges
        if: steps.status.outputs.status == 'active'
        run: |
          python engine/badges.py \
            --portfolio public/versions/${{ matrix.framework_version }}/portfolio.json \
            --output-dir public/versions/${{ matrix.framework_version }}/badges/

      - name: Upload versioned public artifacts
        uses: actions/upload-artifact@v4
        with:
          name: public-version-${{ matrix.framework_version }}
          path: public/versions
          retention-days: 1

  # ── 5. Publish: preserve archived/untouched versions, rebuild version index ─
  run-engine:
    needs: [determine-matrix, assemble-versions]
    if: |
      always() &&
      (github.event_name != 'pull_request' || github.event.action != 'closed') &&
      (needs.determine-matrix.result == 'success' || needs.determine-matrix.result == 'skipped') &&
      (needs.assemble-versions.result == 'success' || needs.assemble-versions.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out current Pages data
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .gh-pages-data
          fetch-depth: 1
          persist-credentials: false

      - name: Carry forward previously published artifacts
        # The legacy pre-versioning portfolio.json/badges are no longer produced
        # by this workflow; carry them forward unchanged. Framework versions not
        # recomputed this run (including archived versions, which are never
        # rescored) are copied from gh-pages as-is; freshly computed versions
        # are overlaid on top in the next step.
        run: |
          mkdir -p public/versions
          rm -f public/portfolio.json public/framework-versions.json
          rm -rf public/badges
          cp .gh-pages-data/portfolio.json public/portfolio.json
          cp -R .gh-pages-data/badges public/badges
          if [ -d .gh-pages-data/versions ]; then
            cp -R .gh-pages-data/versions/. public/versions/
          fi

      - name: Download freshly computed framework versions
        if: needs.determine-matrix.outputs.versions != '[]'
        uses: actions/download-artifact@v4
        with:
          pattern: public-version-*
          path: public/versions
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Regenerate framework version index
        run: |
          python engine/version_index.py \
            --framework-root framework/versions \
            --public-dir public/ \
            --output public/framework-versions.json

      - name: Upload engine artifacts
        uses: actions/upload-artifact@v4
        with:
          name: engine-artifacts
          path: public/
          retention-days: 1

  # ── 6. Build and deploy PR preview ─────────────────────────────────────────
  build-preview:
    needs: run-engine
    if: >
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.repository == 'canonical/pqf'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Download engine artifacts (fresh medals)
        uses: actions/download-artifact@v4
        with:
          name: engine-artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm install
        working-directory: ui

      - name: Build UI
        run: npm run build
        working-directory: ui
        # Vite copies ../public/ (containing fresh portfolio.json from artifacts) into dist/

      - name: Deploy PR preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ui/dist
          destination_dir: pr-preview/pr-${{ github.event.pull_request.number }}
          keep_files: true

      - name: Leave preview comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          url="https://canonical.github.io/pqf/pr-preview/pr-${{ github.event.pull_request.number }}/"
          body="Preview deployed: $url"
          gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body "$body"

  # ── 7. Build and deploy production site from fresh engine artifacts ───────────
  deploy-production:
    needs: run-engine
    if: >
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'canonical/pqf')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download engine artifacts
        uses: actions/download-artifact@v4
        with:
          name: engine-artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm install
        working-directory: ui

      - name: Build UI
        run: npm run build
        working-directory: ui
        # Vite copies ../public/ (downloaded from engine-artifacts) into dist/

      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy_pages_attempt_1
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ui/dist
          destination_dir: .
          keep_files: true

      - name: Wait before deploy retry
        if: steps.deploy_pages_attempt_1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        if: steps.deploy_pages_attempt_1.outcome == 'failure'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ui/dist
          destination_dir: .
          keep_files: true
