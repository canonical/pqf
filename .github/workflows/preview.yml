name: PR Preview

on:
  workflow_run:
    workflows: [Compute Metrics]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'compute-metrics run ID (leave empty to use latest PR compute-metrics)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

# For forks, we need write permissions on the fork itself, not the upstream
# This will be handled by the deploy step gracefully failing on forks
env:
  IS_FORK: ${{ github.repository != 'canonical/pqf' }}

concurrency:
  group: gh-pages-preview-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy-preview:
    name: Build and deploy PR preview
    runs-on: ubuntu-latest
    if: |
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Download compute-metrics artifacts (fresh medals)
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          name: engine-artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm install
        working-directory: ui

      - name: Build UI
        run: npm run build
        working-directory: ui
        # Vite copies ../public/ (containing fresh portfolio.json from artifacts) into dist/

      - name: Deploy PR preview
        if: github.repository == 'canonical/pqf'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./ui/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: deploy

      - name: Note about fork deployments
        if: github.repository != 'canonical/pqf'
        run: |
          echo "✓ Build successful!"
          echo "Note: PR preview deployment only works on the canonical/pqf repository."
          echo "Preview URL would be: https://canonical.github.io/pqf/pr-preview/pr-{PR_NUMBER}/"
