name: PR Preview

on:
  workflow_run:
    workflows: [Compute Metrics]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gh-pages-preview-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy-preview:
    name: Build and deploy PR preview
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Download compute-metrics artifacts (fresh medals)
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: engine-artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm install
        working-directory: ui

      - name: Build UI
        run: npm run build
        working-directory: ui
        # Vite copies ../public/ (containing fresh portfolio.json from artifacts) into dist/

      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./ui/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: deploy
