name: PR Preview

on:
  repository_dispatch:
    types: [preview-pr]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'compute-metrics run ID to fetch artifacts from'
        required: true
        type: string
      pr_number:
        description: 'Pull request number to deploy preview for'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages-preview-${{ github.event.client_payload.pr_number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  deploy-preview:
    name: Build and deploy PR preview
    runs-on: ubuntu-latest
    env:
      RUN_ID: ${{ github.event.client_payload.run_id || inputs.run_id }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number || inputs.pr_number }}
      HEAD_BRANCH: ${{ github.event.client_payload.head_branch || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.head_branch || github.ref_name }}

      - name: Download compute-metrics artifacts (fresh medals)
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.RUN_ID }}
          name: engine-artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm install
        working-directory: ui

      - name: Build UI
        run: npm run build
        working-directory: ui
        # Vite copies ../public/ (containing fresh portfolio.json from artifacts) into dist/

      - name: Deploy PR preview
        if: github.repository == 'canonical/pqf'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./ui/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: deploy
          pr-number: ${{ env.PR_NUMBER }}

      - name: Note about fork deployments
        if: github.repository != 'canonical/pqf'
        run: |
          echo "✓ Build successful!"
          echo "Note: PR preview deployment only works on the canonical/pqf repository."
          echo "Preview URL would be: https://canonical.github.io/pqf/pr-preview/pr-${{ env.PR_NUMBER }}/"
