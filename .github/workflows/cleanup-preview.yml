name: Cleanup PR Preview

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to clean preview for
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages-preview-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup-preview:
    if: github.repository == 'canonical/pqf'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove
          pr-number: ${{ github.event.pull_request.number || inputs.pr_number }}
          comment: false
